[project]
name = "geo-monitor"
version = "0.1.0"
description = "GEO（生成式引擎优化）关键词收录与引用监控系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "playwright>=1.44",
    "playwright-stealth>=1.0.4",
    "celery>=5.4",
    "redis>=5.0",
    "sqlmodel>=0.0.16",
    "psycopg[binary]>=3.1",
    "elasticsearch>=8.13",
    "openai>=1.30",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
